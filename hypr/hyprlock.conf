source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $c_text
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $c_accent
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    rounding = 14
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    inner_color = $c_surface
    outer_color = $c_accent
    font_color = $c_text
    check_color = $c_blue
    fail_color = $c_red
    fade_on_empty = false
    placeholder_text = <i>Пароль</i>
    position = 0, -40
    halign = center
    valign = center
}
